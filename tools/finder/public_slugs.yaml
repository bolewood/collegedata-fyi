# Searchable public URL slugs. When a school's legal federal name and the
# name people actually search differ, schools.yaml `id` must match the
# searchable slug here. The Scorecard INSTNM slug stays a live alias so
# old URLs 308 and archived years still merge. identity_guard.py fails CI
# if yaml drifts back to the legal-name slug.
#
# Add a row when choosing a public URL that is not the INSTNM auto-slug.
# The legal-name slug of a pinned school may go in retired_aliases (it then 308s at
# the edge, before ISR), but only once no live cds_manifest or school_browser_rows row
# is filed under it: retired aliases are excluded from the alias merge (#518).
