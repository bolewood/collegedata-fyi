name: Scholarships load

# Loads the reviewed scholarship records under data/scholarships/ into Supabase
# after they merge to main (PRD 036 M2), then refreshes the public cache. The
# loader validates the whole tree first and aborts on any issue, so a bad merge
# cannot partially load. It is idempotent: rerunning writes the same rows.
#
# The scholarship_* tables come from the 20261114160000_scholarship_directory
# migration, applied from main with `supabase db push --linked`. Until that has
# run, this workflow fails at the load step. After the migration is applied,
# dispatch this workflow once to fill the tables (a migration alone loads no rows).

on:
  push:
    branches: [main]
    paths:
      - "data/scholarships/**"
      # Derived columns (normalized_coverage, filters) come from this code, so a
      # change to it must reload the database even with no YAML change.
      - "tools/scholarships/model.py"
      - "tools/scholarships/load.py"
      - "supabase/migrations/*_scholarship_directory.sql"
      - ".github/workflows/scholarships-load.yml"
  workflow_dispatch:
    inputs:
      allow_prune:
        description: "Allow removing more than 5 programs (or 10%) in one run"
        type: boolean
        default: false

concurrency:
  group: scholarships-load
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    name: Validate and load scholarship records
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r tools/ci-requirements.txt

      - name: Validate records and dry-run the load
        run: |
          python tools/scholarships/validate.py data/scholarships/programs
          python tools/scholarships/load.py --report scholarships-out/load-report.json

      # The service role key is scoped to this step so dependency install code
      # never sees it.
      - name: Load records into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALLOW_PRUNE: ${{ inputs.allow_prune }}
        run: |
          set -euo pipefail
          flags=""
          if [[ "${ALLOW_PRUNE}" == "true" ]]; then
            flags="--allow-prune"
          fi
          python tools/scholarships/load.py --apply ${flags} --report scholarships-out/load-report.json

      # Best effort: tell the web app to refresh the school pages and /scholarships
      # so new or corrected terms show within minutes, not after the 24 h cache.
      # Never fails the run (the load above is the part that matters). No-op when
      # the URL or secret is unset.
      - name: Tell the web app to refresh scholarship pages
        if: success()
        continue-on-error: true
        env:
          QUADFILE_REVALIDATE_URL: ${{ vars.QUADFILE_REVALIDATE_URL || vars.COLLEGEDATA_REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [[ -z "${QUADFILE_REVALIDATE_URL:-}" || -z "${REVALIDATE_SECRET:-}" ]]; then
            echo "revalidate: URL or secret not set; skipping"
            exit 0
          fi
          # Batches of 100 school ids (the endpoint's cap), each also expiring the directory read.
          jq -c '(.school_ids // []) as $ids | range(0; $ids | length; 100) as $i | $ids[$i:$i+100]' scholarships-out/load-report.json | while read -r batch; do
            body=$(jq -c -n --argjson ids "$batch" '{school_ids: $ids, scholarships: true}')
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -X POST "${QUADFILE_REVALIDATE_URL}" \
              -H "Authorization: Bearer ${REVALIDATE_SECRET}" \
              -H "Content-Type: application/json" \
              -d "$body" || echo "curl-failed")
            echo "revalidate: batch of $(jq 'length' <<<"$batch") -> HTTP ${code}"
          done || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarships-load
          path: scholarships-out/
          if-no-files-found: ignore
