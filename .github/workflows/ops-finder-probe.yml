name: Ops finder probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "unknown = cooldown-aged unknowns; stuck-pdf = stale PDF seeds; both = stuck first, remaining Brave budget on unknowns."
        type: choice
        options:
          - both
          - stuck-pdf
          - unknown
        default: both
      cooldown_days:
        description: "Skip unknowns probed within N days (0 = ignore)."
        required: false
        default: "30"
      brave_budget:
        description: "Max Brave Search API calls this run (0 = unlimited)."
        required: false
        default: "1800"
      apply_landing_hints:
        description: "Apply high-confidence landing-page seed rewrites."
        type: boolean
        required: false
        default: true
      create_pr:
        description: "Open a PR if schools.yaml changed."
        type: boolean
        required: false
        default: true
  schedule:
    # Monthly. The README called this a cron for months; nothing actually
    # called the Brave API after 2026-04-14. Day 2 avoids colliding with
    # the IPEDS release probe on the 5th.
    - cron: "18 14 2 * *"

concurrency:
  group: ops-finder-probe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    name: Probe CDS listing URLs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      create_pr: ${{ steps.flags.outputs.create_pr }}
    env:
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://api.collegedata.fyi
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzZHV3bXlndm1kb3pocHZ6YWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDk3NTksImV4cCI6MjA5MTY4NTc1OX0.fYZOIHyrOWzidgc-CVxWCY5Fe9pQk12-6YjDIS6y9qs
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
      INPUT_COOLDOWN_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.cooldown_days || '30' }}
      INPUT_BRAVE_BUDGET: ${{ github.event_name == 'workflow_dispatch' && inputs.brave_budget || '1800' }}
      INPUT_APPLY_LANDING_HINTS: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_landing_hints }}
      INPUT_CREATE_PR: ${{ github.event_name != 'workflow_dispatch' || inputs.create_pr }}
      PIPELINE_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'dispatch' }}
      PIPELINE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Snapshot schools.yaml at start
        run: |
          mkdir -p finder-probe
          cp tools/finder/schools.yaml finder-probe/schools-base.yaml

      - id: flags
        run: echo "create_pr=${INPUT_CREATE_PR}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r tools/ci-requirements.txt

      - name: Require Brave API key
        run: |
          if [[ -z "${BRAVE_API_KEY}" ]]; then
            echo "::error::Add the BRAVE_API_KEY repository secret. The finder talks to api.search.brave.com, not public brave.com, and has not been called since 2026-04-14."
            exit 2
          fi

      - name: Classify stuck PDF seeds
        run: |
          mkdir -p finder-probe
          python tools/finder/stuck_pdf_seeds.py \
            --out-json finder-probe/stuck.json \
            --out-md finder-probe/stuck.md \
            --out-ids finder-probe/stuck-ids.txt

      - name: Heartbeat finder_stuck_pdf start
        if: env.INPUT_MODE == 'both' || env.INPUT_MODE == 'stuck-pdf'
        run: |
          python tools/ops/record_heartbeat.py \
            --station finder_stuck_pdf \
            --status running \
            --trigger "${PIPELINE_TRIGGER}" \
            --run-url "${PIPELINE_RUN_URL}"

      - id: re_probe_stuck
        name: Re-probe stuck PDF seeds
        if: env.INPUT_MODE == 'both' || env.INPUT_MODE == 'stuck-pdf'
        run: |
          set -euo pipefail
          # No nested bash heredocs in this step. GHA keeps relative indent, so
          # an indented terminator never closes and bash fails at parse time
          # even on the empty-ids branch (2026-09-02: 110 stuck, 0 re-probed).
          # stuck_pdf_seeds.py writes a lone newline when nothing is flagged, so
          # -s is true for an empty list; test for any non-blank character.
          if [[ -z "$(tr -d '[:space:]' < finder-probe/stuck-ids.txt)" ]]; then
            echo "No stuck PDF seeds to re-probe."
            printf '%s\n' '{"probed":0,"found":0,"replaced":0,"budget_remaining":0,"still_stuck":0}' \
              > finder-probe/stuck-probe-summary.json
            exit 0
          fi
          PYTHONUNBUFFERED=1 python tools/finder/probe_urls.py \
            --brave-fallback \
            --ids-file finder-probe/stuck-ids.txt \
            --brave-budget "${INPUT_BRAVE_BUDGET}" \
            --school-budget-sec 20 \
            --save-every 25 \
            --summary-json finder-probe/stuck-probe-summary.json \
            2>&1 | tee finder-probe/stuck-probe.log

      - name: Open issue when stuck-PDF re-probe fails
        if: failure() && steps.re_probe_stuck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python tools/ops/upsert_pipeline_alert_issue.py \
            --repo "${REPO}" \
            --component finder_stuck_pdf \
            --title "Pipeline alert: Stuck PDFs re-probe failed" \
            --run-url "${PIPELINE_RUN_URL}" \
            --body "The monthly/dispatch finder step \`Re-probe stuck PDF seeds\` failed.

          When this stays red, archive keeps hitting stale single-year PDF seeds and new CDS years stop arriving.

          Run: ${PIPELINE_RUN_URL}
          "

      - name: Heartbeat finder_brave start
        if: ${{ always() && !cancelled() && (env.INPUT_MODE == 'both' || env.INPUT_MODE == 'unknown') }}
        run: |
          python tools/ops/record_heartbeat.py \
            --station finder_brave \
            --status running \
            --trigger "${PIPELINE_TRIGGER}" \
            --run-url "${PIPELINE_RUN_URL}"

      - id: probe_unknown
        name: Probe unknown schools
        if: ${{ always() && !cancelled() && (env.INPUT_MODE == 'both' || env.INPUT_MODE == 'unknown') }}
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python tools/finder/probe_urls.py \
            --brave-fallback \
            --audit-active-html \
            --audit-report-json finder-probe/active-html-audit.json \
            --include-active-no-hint \
            --cooldown-days "${INPUT_COOLDOWN_DAYS}" \
            --brave-budget "${INPUT_BRAVE_BUDGET}" \
            --new-two-year-cap 300 \
            --school-budget-sec 20 \
            --save-every 50 \
            --summary-json finder-probe/unknown-summary.json \
            2>&1 | tee finder-probe/unknown-probe.log

      - name: Heartbeat finder_brave finish
        if: always() && (env.INPUT_MODE == 'both' || env.INPUT_MODE == 'unknown')
        env:
          STEP_OUTCOME: ${{ steps.probe_unknown.outcome }}
        run: |
          if [[ ! -f finder-probe/unknown-summary.json ]]; then
            printf '{"probed":0,"found":0,"replaced":0,"budget_remaining":0}\n' > finder-probe/unknown-summary.json
          fi
          status=ok
          error=none
          if [[ "$STEP_OUTCOME" == "failure" ]]; then
            status=error
            error=job_failed
          fi
          python tools/ops/record_heartbeat.py \
            --station finder_brave \
            --status "$status" \
            --trigger "${PIPELINE_TRIGGER}" \
            --summary-json finder-probe/unknown-summary.json \
            --error-code "$error" \
            --run-url "${PIPELINE_RUN_URL}"

      - name: Heartbeat finder_landing_hints start
        if: ${{ always() && !cancelled() && env.INPUT_APPLY_LANDING_HINTS == 'true' }}
        run: |
          python tools/ops/record_heartbeat.py \
            --station finder_landing_hints \
            --status running \
            --trigger "${PIPELINE_TRIGGER}" \
            --run-url "${PIPELINE_RUN_URL}"

      - id: promote_landing_hints
        name: Promote high-confidence landing hints
        if: ${{ always() && !cancelled() && env.INPUT_APPLY_LANDING_HINTS == 'true' }}
        run: |
          set -euo pipefail
          python tools/finder/promote_landing_hints.py \
            --min-confidence medium \
            --ids-file finder-probe/stuck-ids.txt \
            --apply \
            --report finder-probe/landing-hints.md \
            --summary-json finder-probe/landing-hints-summary.json \
            2>&1 | tee finder-probe/landing-hints.log

      - name: Heartbeat finder_landing_hints finish
        if: always() && env.INPUT_APPLY_LANDING_HINTS == 'true'
        env:
          STEP_OUTCOME: ${{ steps.promote_landing_hints.outcome }}
        run: |
          if [[ ! -f finder-probe/landing-hints-summary.json ]]; then
            printf '{"proposals":0,"promoted":0}\n' > finder-probe/landing-hints-summary.json
          fi
          status=ok
          error=none
          if [[ "$STEP_OUTCOME" == "failure" ]]; then
            status=error
            error=job_failed
          fi
          python tools/ops/record_heartbeat.py \
            --station finder_landing_hints \
            --status "$status" \
            --trigger "${PIPELINE_TRIGGER}" \
            --summary-json finder-probe/landing-hints-summary.json \
            --error-code "$error" \
            --run-url "${PIPELINE_RUN_URL}"

      - id: refresh_stuck
        name: Refresh stuck report after seed rewrites
        run: |
          python tools/finder/stuck_pdf_seeds.py \
            --out-json finder-probe/stuck-after.json \
            --out-md finder-probe/stuck-after.md \
            --out-ids finder-probe/stuck-ids-after.txt

      - id: reprobe_outcome
        name: Judge re-probe outcome
        if: ${{ always() && !cancelled() && (env.INPUT_MODE == 'both' || env.INPUT_MODE == 'stuck-pdf') }}
        run: |
          set -euo pipefail
          # A school is fixed only when its new seed reaches a year newer than
          # the archive holds, or is a current listing page. Replaced is not fixed.
          python tools/finder/reprobe_outcome.py \
            --flagged finder-probe/stuck.json \
            --schools-yaml tools/finder/schools.yaml \
            --probe-summary finder-probe/stuck-probe-summary.json \
            --out-json finder-probe/reprobe-outcome.json \
            --out-md finder-probe/reprobe-outcome.md \
            --out-heartbeat finder-probe/stuck-heartbeat.json

      - name: Heartbeat finder_stuck_pdf finish
        if: always() && (env.INPUT_MODE == 'both' || env.INPUT_MODE == 'stuck-pdf')
        env:
          STEP_OUTCOME: ${{ steps.re_probe_stuck.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh_stuck.outcome }}
          JUDGE_OUTCOME: ${{ steps.reprobe_outcome.outcome }}
        run: |
          status=ok
          error=none
          if [[ ! -f finder-probe/stuck-ids.txt ]]; then
            # The classifier never wrote its list: nothing can be called ok.
            status=error
            error=job_failed
          elif [[ -n "$(tr -d '[:space:]' < finder-probe/stuck-ids.txt)" ]]; then
            # Schools were flagged: every step has to have run and succeeded.
            # A skipped step after an earlier failure is not ok.
            for outcome in "$STEP_OUTCOME" "$REFRESH_OUTCOME" "$JUDGE_OUTCOME"; do
              if [[ "$outcome" != "success" ]]; then
                status=error
                error=job_failed
              fi
            done
          else
            # Nothing flagged: the re-probe exits early; only a failure counts.
            for outcome in "$STEP_OUTCOME" "$REFRESH_OUTCOME" "$JUDGE_OUTCOME"; do
              if [[ "$outcome" == "failure" ]]; then
                status=error
                error=job_failed
              fi
            done
          fi
          if [[ ! -f finder-probe/stuck-heartbeat.json ]]; then
            printf '{"stuck":0,"reprobed":0,"still_stuck":0}\n' > finder-probe/stuck-heartbeat.json
          fi
          python tools/ops/record_heartbeat.py \
            --station finder_stuck_pdf \
            --status "$status" \
            --trigger "${PIPELINE_TRIGGER}" \
            --summary-json finder-probe/stuck-heartbeat.json \
            --error-code "$error" \
            --run-url "${PIPELINE_RUN_URL}"

      - name: Add run summary
        if: always()
        run: |
          # The stuck report goes here and into the artifact. It used to be a
          # monthly comment on a standing issue, which read as "known and
          # handled" while the count stayed flat (postmortem section 4).
          {
            echo "## Finder probe"
            echo
            echo "Mode: \`${INPUT_MODE}\`"
            echo
            if [[ -f finder-probe/reprobe-outcome.md ]]; then
              head -c 20000 finder-probe/reprobe-outcome.md
              echo
            fi
            if [[ -f finder-probe/stuck.md ]]; then
              echo "### Stuck PDF seeds before the re-probe"
              echo
              head -c 12000 finder-probe/stuck.md
              echo
            fi
            if [[ -f finder-probe/stuck-ids-after.txt ]]; then
              echo "### Stuck PDF seeds after"
              echo
              wc -l < finder-probe/stuck-ids-after.txt | awk '{print $1 " school ids still flagged (full list in the finder-probe artifact)"}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot probed schools.yaml
        if: always()
        run: |
          mkdir -p finder-probe
          cp tools/finder/schools.yaml finder-probe/schools.yaml
          git diff -- tools/finder/schools.yaml > finder-probe/schools.yaml.diff || true

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-probe
          path: finder-probe/
          if-no-files-found: warn

  publish-seeds:
    name: Open seed PR from latest main
    needs: probe
    # Probe can go red after Brave already checkpointed schools.yaml
    # (landing-hints, coverage issue, a later heartbeat). Friday lost a
    # 2h45m run because the seed push lived in the failing job. Publish
    # from the artifact whenever the probe job actually ran.
    if: ${{ always() && !cancelled() && needs.probe.outputs.create_pr == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'both' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: finder-probe
          path: finder-probe

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Overlay probed seeds onto current main
        run: |
          test -s finder-probe/schools-base.yaml
          test -s finder-probe/schools.yaml
          python tools/finder/merge_schools_yaml.py \
            --base finder-probe/schools-base.yaml \
            --main tools/finder/schools.yaml \
            --probed finder-probe/schools.yaml \
            --out tools/finder/schools.yaml

      - id: open_seed_pr
        name: Open PR for seed updates
        env:
          REPO: ${{ github.repository }}
          PIPELINE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/finder/schools.yaml
          staged="$(git diff --cached --name-only)"
          if [[ -z "$staged" ]]; then
            echo "No schools.yaml changes against origin/main."
            exit 0
          fi
          if [[ "$staged" != "tools/finder/schools.yaml" ]]; then
            echo "::error::publish-seeds may only commit tools/finder/schools.yaml"
            printf '%s\n' "$staged"
            exit 1
          fi
          branch="chore/finder-probe-${GITHUB_RUN_ID}"
          git checkout -B "$branch"
          # Avoid nested indented heredocs; multi-line -m is enough.
          git commit -m "$(printf '%s\n' \
            'chore: refresh CDS discovery seeds from monthly finder probe' \
            '' \
            'Re-probe stale PDF seeds and unknowns via the Brave Search API, and' \
            'promote high-confidence HTML listings so weekly archive is not stuck' \
            'on a single year file.')"
          git push -u origin HEAD
          body="$(printf '%s\n' \
            '## Summary' \
            "- Monthly finder probe (\`${INPUT_MODE}\`) updated \`tools/finder/schools.yaml\`." \
            '- Stuck PDF-seed report is in the run summary and the `finder-probe` artifact.' \
            '' \
            '## Test plan' \
            '- [ ] Skim the PR diff for accidental satellite-campus seed copies' \
            '- [ ] Merging this PR auto-enqueues changed seeds via \`ops-archive-seed-catchup\`')"
          if gh pr create \
            --title "chore: refresh CDS discovery seeds from monthly finder probe" \
            --body "$body"; then
            exit 0
          fi
          # Repo setting "Allow GitHub Actions to create and approve pull
          # requests" may be off — branch is still on origin; surface an issue
          # with a one-click compare link instead of silently stranding seeds
          # (2026-09-02 left chore/finder-probe-33664025899 with no PR).
          compare="https://github.com/${REPO}/compare/main...${branch}?quick_pull=1"
          echo "::error::gh pr create failed after pushing ${branch}. Open ${compare}"
          printf '%s\n' "$branch" > finder-probe-seed-branch.txt
          printf '%s\n' "$compare" > finder-probe-seed-compare.txt
          exit 1

      - name: Open issue when seed PR publish fails
        if: failure() && steps.open_seed_pr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PIPELINE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="chore/finder-probe-${GITHUB_RUN_ID}"
          compare="https://github.com/${REPO}/compare/main...${branch}?quick_pull=1"
          python tools/ops/upsert_pipeline_alert_issue.py \
            --repo "${REPO}" \
            --component finder_seed_publish \
            --title "Pipeline alert: Finder seed branch needs PR" \
            --run-url "${PIPELINE_RUN_URL}" \
            --body "Finder probe pushed \`${branch}\` but could not open the PR (often: Actions is not permitted to create pull requests).

          One-click PR: ${compare}

          Merge that PR so \`ops-archive-seed-catchup\` enqueues the new seeds. Without it, archive keeps using stale URLs and intake stalls.
          "
