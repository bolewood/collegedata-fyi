name: CI

on:
  pull_request:
    # Docs-only changes skip CI, except the copy deck: web/src/app/data-quality/copy-deck.test.tsx reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.context/**"
      - "docs/copy/**"
  push:
    branches:
      - main
      - "santhonys/**"
    # Docs-only changes skip CI, except the copy deck: web/src/app/data-quality/copy-deck.test.tsx reads it.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.context/**"
      - "docs/copy/**"
  workflow_dispatch:

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # scholarship published-version check needs merge-base history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - name: Install Python test dependencies
        run: python -m pip install -r tools/ci-requirements.txt
      - name: Run browser projection tests
        run: python -m unittest tools.browser_backend.project_browser_data_test tools.browser_backend.overlay_parity_test
      - name: Run extraction scoreboard tests
        run: python -m unittest discover -s tools/extraction-validator -p "test_*.py"
      - name: Run Tier 4 cleaner tests
        run: python -m unittest discover -s tools/extraction_worker -p "test_*.py"
      - name: Run template overlay worker entry tests (pytest-style; named so unittest discovery skips it)
        run: python -m pytest tools/extraction_worker/overlay_entry_test.py -q
      - name: Run archive/extractor routing tests
        run: |
          python -m unittest tools.tier_probe.test_probe
          python -m unittest tools.tier1_extractor.test_extract
      - name: Audit schools.yaml IPEDS identities
        run: python tools/finder/identity_guard.py
      - name: Audit retired school redirects
        run: python tools/finder/school_redirect_guard.py
      - name: Run finder identity tests
        run: python -m unittest tools.finder.test_identity_guard tools.finder.test_school_redirect_guard tools.finder.test_probe_urls tools.finder.test_stuck_pdf_seeds tools.finder.test_freshness_floor_cases tools.finder.test_reprobe_outcome tools.finder.test_apply_probe_log tools.finder.test_promote_landing_hints tools.finder.test_finder_workflows tools.finder.test_waf_blocked_urls tools.finder.test_headless_archive tools.finder.test_archive_identity tools.finder.test_ir_hubs tools.finder.test_backfill_ir_hubs tools.finder.test_seed_age
      - name: Run scorecard loader tests
        run: python -m unittest tools.scorecard.test_load_directory
      - name: Run waitlist recipe builder tests
        run: python -m unittest tools.scorecard.test_build_waitlist_recipe
      - name: Run FSA nonpayment tests
        run: python -m unittest discover -s tools/fsa -p "test_*.py"
      - name: Run IPEDS loader tests
        run: python -m unittest discover -s tools/ipeds -p "test_*.py"
      - name: Run change intelligence tests
        run: python -m unittest discover -s tools/change_intelligence -p "test_*.py"
      - name: Run checkbox label decoder tests
        run: python -m unittest tools.schema_builder.test_decode_checkboxes
      - name: Run discovery policy and engine tests
        run: python -m pytest tools/discovery -q
      - name: Run scholarship record tests
        run: python -m pytest tools/scholarships -q
      - name: Validate scholarship records
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          # Pushes to main compare to the commit before the push, so an edit to a
          # published version cannot slip in by pushing straight to main.
          # Pull requests and other branch pushes compare to the merge base with
          # main, so a branch cut before another PR merged is not blamed for it.
          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" = "main" ] \
            && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            python tools/scholarships/validate.py data/scholarships/programs --base "${BEFORE_SHA}"
          else
            python tools/scholarships/validate.py data/scholarships/programs --merge-base origin/main
          fi
      - name: Run shared polite fetcher tests
        run: python -m pytest tools/common -q
      # The Tier 2 suite renders PDF pages and takes far longer than every
      # other step combined. On pull requests and branch pushes it runs only
      # when something it depends on changed. Pushes to main and manual
      # dispatches always run it.
      - name: Decide whether the Tier 2 suite is needed
        id: tier2
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'main' }}
        run: |
          set -euo pipefail
          run=true
          reason="always on ${EVENT_NAME}"
          if [ "${EVENT_NAME}" = "pull_request" ] || { [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" != "main" ]; }; then
            # Fail open: if the comparison cannot be read, or it is large
            # enough to be truncated (300 files), run the suite.
            if files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.files[].filename')" \
              && [ "$(printf '%s\n' "${files}" | grep -c .)" -lt 300 ]; then
              if printf '%s\n' "${files}" | grep -Eq '^(tools/tier2_extractor/|tools/browser_backend/|tools/extraction_worker/|tools/schema_builder/|schemas/|tools/ci-requirements\.txt$|\.github/workflows/ci\.yml$)'; then
                reason="a dependency of the suite changed"
              else
                run=false
                reason="no Tier 2 dependency changed"
              fi
            else
              reason="could not read the change list"
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "Tier 2 suite: run=${run} (${reason})"
      - name: Run Tier 2 field map tests
        if: steps.tier2.outputs.run == 'true'
        run: python -m pytest tools/tier2_extractor -q -n auto
      - name: Lint GHA run-script heredocs
        run: python tools/ops/lint_gha_heredocs.py
      - name: Run ops tests
        run: python -m unittest tools.ops.test_automation_health tools.ops.test_record_heartbeat tools.ops.test_pipeline_writers tools.ops.test_collegedata_ops_bundle tools.ops.test_directory_enqueue_autopilot tools.ops.test_directory_enqueue_batches tools.ops.test_extraction_backlog_audit tools.ops.test_enqueue_changed_seeds tools.ops.test_upsert_pipeline_alert_issue tools.ops.test_notify_discord tools.ops.test_top100_coverage tools.ops.test_lint_gha_heredocs tools.ops.test_revalidate_pages tools.ops.test_discovery_renewal tools.ops.test_renewal_alarm tools.ops.test_fetch_failures tools.ops.test_same_year_duplicates tools.ops.test_hand_check_sample tools.ops.test_consecutive_failures tools.ops.test_heartbeat_key_registry
      - name: Run community usage exclusion tests
        run: python -m unittest tools.community.test_usage_exclusion
      - name: Run API usage ingest tests
        run: python -m unittest tools.api_usage.test_classify tools.api_usage.test_ingest_gateway_logs tools.api_usage.test_pipeline_identity tools.api_usage.test_publish
      - name: Run data-integrity audit support tests
        run: python -m unittest tools.data_quality.test_audit_support tools.data_quality.test_corpus_audit tools.data_quality.test_published_years

  migrations:
    # Structural sanity checks on supabase/migrations/. Verifies every
    # file has a 14-digit timestamp prefix, that no two prefixes
    # collide, and that filenames sort the way an apply order expects.
    # Catches typo'd timestamps and duplicate filenames before they
    # corrupt the apply sequence.
    #
    # Why not a full `supabase db reset` replay? Several migrations
    # contain DO-block verifications that assume production data is
    # present (e.g. `20260415160009_detected_year.sql` raises if a
    # COALESCE returns null on an empty database). A clean CI database
    # has no rows, so those checks fail. The actual "this migration is
    # in production but not in main" drift cannot be detected from CI
    # without prod credentials — that's a process safeguard documented
    # in CLAUDE.md, not a code one. Manual `supabase db reset` against
    # a seeded local DB is the canonical full-replay smoke test.
    name: Migration filename hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate migration filenames
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No migration files found"
            exit 1
          fi
          fail=0
          declare -A seen_prefix
          for f in "${files[@]}"; do
            base=$(basename "$f")
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$f::Migration filename must match YYYYMMDDHHMMSS_snake_case.sql"
              fail=1
            fi
            prefix="${base:0:14}"
            if [[ -n "${seen_prefix[$prefix]:-}" ]]; then
              echo "::error file=$f::Duplicate migration timestamp $prefix (also in ${seen_prefix[$prefix]})"
              fail=1
            fi
            seen_prefix[$prefix]="$base"
          done
          # Verify lexical order matches numeric timestamp order — they
          # should always agree since the prefix is fixed-width, but
          # this catches the rare hand-crafted variant.
          ls -1 supabase/migrations/*.sql | LC_ALL=C sort -c
          exit $fail

  deno:
    name: Supabase function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Deno tests
        run: deno test --allow-env --allow-read supabase/functions/_shared/*.test.ts supabase/functions/archive-enqueue/*.test.ts supabase/functions/archive-process/*.test.ts supabase/functions/browser-search/*.test.ts supabase/functions/directory-enqueue/*.test.ts
      - name: Run data-integrity resolver support tests
        run: deno test tools/data_quality/reprobe_resolver_cohort.test.ts

  mcp:
    name: MCP stdio handshake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run package and snapshot tests
        run: node --test packages/mcp-server/collegedata-mcp.test.js packages/cli/collegedata.test.js tools/snapshots/build_public_snapshots.test.mjs

  web:
    name: Next.js build
    # Playwright 1.59 does not ship chromium for ubuntu-26.04 (current ubuntu-latest).
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://isduwmygvmdozhpvzaix.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzZHV3bXlndm1kb3pocHZ6YWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDk3NTksImV4cCI6MjA5MTY4NTc1OX0.fYZOIHyrOWzidgc-CVxWCY5Fe9pQk12-6YjDIS6y9qs"
      NEXT_PUBLIC_FEEDBACK_FORMSPREE_ENDPOINT: "https://formspree.io/f/testform"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck web app
        working-directory: web
        run: npm run typecheck
      - name: Run web unit tests
        working-directory: web
        run: npm test
      # The build and the Playwright smoke tests read the production API with
      # the public key: about 2,600 database reads per run, competing with
      # real visitors on a small database. They run only when the web app or
      # this workflow changed. Typecheck and unit tests above always run.
      # Pushes to main compare against the previous main commit, so a web
      # change is still built and smoke tested after it merges.
      - name: Decide whether the build and smoke tests are needed
        id: webbuild
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run=true
          reason="always on ${EVENT_NAME}"
          base=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="${PR_BASE}"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_NAME}" = "main" ]; then
            base="${PUSH_BEFORE}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="main"
          fi
          # Fail open: no usable base (first push of a branch reports all
          # zeros), an unreadable comparison, or one large enough to be
          # truncated (300 files) runs the build.
          if [ -n "${base}" ] && ! printf '%s' "${base}" | grep -Eq '^0+$'; then
            if files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${HEAD_SHA}" --jq '.files[].filename')" \
              && [ "$(printf '%s\n' "${files}" | grep -c .)" -lt 300 ]; then
              if printf '%s\n' "${files}" | grep -Eq '^(web/|\.github/workflows/ci\.yml$)'; then
                reason="the web app or this workflow changed"
              else
                run=false
                reason="nothing under web/ changed"
              fi
            else
              reason="could not read the change list"
            fi
          elif [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            reason="no base commit to compare against"
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "Web build and smoke tests: run=${run} (${reason})"
      - name: Build web app
        if: steps.webbuild.outputs.run == 'true'
        working-directory: web
        run: npm run build
      - name: Check public data API for smoke tests
        if: steps.webbuild.outputs.run == 'true'
        id: data-api
        run: |
          if curl --fail --silent --show-error --max-time 8 \
            -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/cds_manifest?select=document_id&limit=1" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Playwright smoke tests because the public data API is unavailable."
          fi
      - name: Install Playwright browser
        if: steps.data-api.outputs.available == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run frontend smoke tests
        if: steps.data-api.outputs.available == 'true'
        working-directory: web
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: "npm run start"
        run: npm run test:smoke
