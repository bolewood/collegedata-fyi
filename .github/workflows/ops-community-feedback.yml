name: Community feedback notifications

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: community-feedback-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Send private count-only digest
        env:
          COMMUNITY_NOTIFICATIONS_ENABLED: ${{ vars.COMMUNITY_NOTIFICATIONS_ENABLED }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          COMMUNITY_NOTIFICATION_FROM: ${{ secrets.COMMUNITY_NOTIFICATION_FROM }}
          COMMUNITY_INBOX_URL: ${{ secrets.COMMUNITY_INBOX_URL }}
        run: python tools/community/notify_feedback.py
