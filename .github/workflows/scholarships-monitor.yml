name: Scholarship monitor

# PRD 036 M4. Fetches the official sources of every served scholarship
# version, records one row per version in scholarship_version_checks and
# refreshes the directory cache. It never edits data/scholarships/ and never
# publishes: only a detected change in terms (an amount, date, year or selection
# word) sets needs_review, which flips the public freshness status. Stale signals,
# unreachable sources and unreadable pages are listed in the issue but never change
# public status. One upserted GitHub issue lists every flagged version each run.
#
# Schedules (UTC). GitHub treats day-of-month and day-of-week as OR, so no
# schedule sets both:
#   - weekly, Mondays, July to January        (full check)
#   - monthly, the 1st, February to June      (full check)
#   - daily                                   (only versions with a required or
#                                              priority milestone 30 or 7 days away)
# The mode is read from github.event.schedule, so keep the strings below in step
# with the case statement in the monitor step. Conditional-GET validators live in
# each version's own check row, so there is no cross-run cache step.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full checks every served version; milestones only those with a milestone 30 or 7 days away"
        type: choice
        options: [full, milestones]
        default: full
      dry_run:
        description: "Dry run: fetch and report, write no rows and no cache"
        type: boolean
        default: true
      only:
        description: "Optional program_id to check alone"
        type: string
        default: ""
  schedule:
    - cron: "17 9 * 1,7-12 1"
    - cron: "17 9 1 2-6 *"
    - cron: "47 8 * * *"

concurrency:
  group: scholarships-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check scholarship sources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_ONLY: ${{ inputs.only }}
      PIPELINE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r tools/ci-requirements.txt

      # The service role key is scoped to this step so dependency install code
      # never sees it. A dry run reads it only to diff against stored baselines.
      - id: monitor
        name: Run the monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          mode=full
          apply=true
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${EVENT_SCHEDULE}" == "47 8 * * *" ]]; then mode=milestones; fi
          else
            mode="${INPUT_MODE}"
            if [[ "${INPUT_DRY_RUN}" == "true" ]]; then apply=false; fi
          fi
          args=(--mode "${mode}"
                --findings-json scholarship-monitor/findings.json
                --findings-md scholarship-monitor/findings.md)
          if [[ -n "${INPUT_ONLY:-}" ]]; then args+=(--only "${INPUT_ONLY}"); fi
          if [[ "${apply}" == "true" ]]; then args+=(--apply); fi
          mkdir -p scholarship-monitor
          # Rows are inserted as each version finishes, and findings are written even
          # after a failure, so the outputs below are set before the step exits.
          python tools/scholarships/monitor.py "${args[@]}" | tee scholarship-monitor/run.log
          rc="${PIPESTATUS[0]}"
          count=0
          if [[ -f scholarship-monitor/findings.json ]]; then
            count="$(python -c "import json; print(len(json.load(open('scholarship-monitor/findings.json'))))")"
          fi
          echo "findings=${count}" >> "$GITHUB_OUTPUT"
          echo "apply=${apply}" >> "$GITHUB_OUTPUT"
          if [[ -f scholarship-monitor/findings.md ]]; then
            cat scholarship-monitor/findings.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${rc}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scholarship-monitor
          path: scholarship-monitor/
          if-no-files-found: ignore

      - name: Open or update the findings issue
        if: always() && steps.monitor.outputs.findings != '' && steps.monitor.outputs.findings != '0' && steps.monitor.outputs.apply == 'true'
        run: |
          python tools/ops/upsert_pipeline_alert_issue.py \
            --repo "${REPO}" \
            --component scholarship_monitor \
            --title "Scholarship monitor: terms changed or stale, review needed" \
            --run-url "${PIPELINE_RUN_URL}" \
            --body "$(cat scholarship-monitor/findings.md)"

      - name: Open issue when the monitor itself fails
        if: failure() && steps.monitor.outcome == 'failure' && github.event_name == 'schedule'
        run: |
          python tools/ops/upsert_pipeline_alert_issue.py \
            --repo "${REPO}" \
            --component scholarship_monitor \
            --title "Pipeline alert: scholarship monitor failed to run" \
            --run-url "${PIPELINE_RUN_URL}" \
            --body "The scholarship monitor did not finish, so changed scholarship terms are not being detected."
