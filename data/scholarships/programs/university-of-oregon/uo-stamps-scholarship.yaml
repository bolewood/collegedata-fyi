    notes: 'The page gives no year for these dates and calls this ''the 2026-2027 scholarship''; that
      label appears to be left over from the prior cycle, and the undated Nov 1 / Nov 15 deadlines are
      recorded as recurring. The first-year scholarships page shows the same Stamps due date (November
      15). The page says the semifinalist interview is on the University of Oregon campus; the finalist
      interview by the Stamps Scholars Program has no stated format, so interview_mode is unknown. The
      interview date is approximate: the page says only ''late January/early February'', recorded here
      as February 1 with approximate precision. The scholarship is awarded in partnership with the Stamps
      Scholars Program.'
