    notes: Every applicant is considered; Villanova selects candidates and invites them to submit the
      Presidential Scholars Program application, which includes short-answer essays. The invitation carries
      that application's deadline, which the page does not state. Finalists are required to attend an
      on-campus Interview Program in March and are notified of the decision after it. The January 15 date
      has no year on the page; the Class of 2031 and the 2027 Interview Program dates are the page's own
      cohort wording. A separate Caritas Presidential Scholarship exists and is not recorded here.
