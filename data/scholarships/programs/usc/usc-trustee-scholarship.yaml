    notes: The dates carry no year on the first-year dates page. The same page lists Regular Decision
      for most majors by January 10 but does not say those applicants are considered for merit scholarships.
      The guide says the merit scholarship 'will be applied automatically as long as your enrollment commitment
      deposit is received by May 1'; that is about accepting an award already offered, not a promise of
      selection. The Dornsife FAQ question is the only place found where Trustee is described as covering
      tuition in full, and it is the premise of a student question, so coverage is recorded as unknown.
      The guide section is labeled 2026-2027 and may carry the prior cycle's terms; the dates page is
      for the cycle with a January 10, 2027 deadline.
