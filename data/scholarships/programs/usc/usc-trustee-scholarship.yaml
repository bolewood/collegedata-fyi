    notes: 'Renewable for each subsequent year, up to six additional semesters (eight for the five-year
      Bachelor of Architecture program), if the student keeps USC academic standing, completes at least
      30 units a year and meets conduct standards. Full-time enrollment is required each semester. Shortfall:
      scholarship probation for a maximum of two semesters (16 units per semester).'
  stacking_rules:
  - other_aid_type: institutional_merit
    relation: not_allowed
    note: Admission Merit Scholarships are mutually exclusive; the student receives only the one with
      the greatest value.
  - other_aid_type: outside_scholarship
    relation: counts_within_package
    note: Tuition-restricted awards from other non-need sources may be combined if the total does not
      exceed USC tuition by more than $8,000.
  - other_aid_type: institutional_need
    relation: counts_within_package
    note: The guide says merit scholarships may reduce need-based aid depending on source and need; combined
      scholarships and need-based aid cannot exceed USC-determined need.
