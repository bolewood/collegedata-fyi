  stacking_rules:
  - other_aid_type: institutional_merit
    relation: allowed
    note: Eligible for additional NC State merit scholarships provided total funds do not exceed the cost
      of attendance, unless the awarding department stipulates otherwise.
  - other_aid_type: outside_scholarship
    relation: counts_within_package
    note: NC State adjusts the Park Scholarship if outside awards plus Park exceed cost of attendance
      in a semester.
  - other_aid_type: federal_or_state_need
    relation: counts_within_package
    note: Park Scholarship is reduced appropriately for Pell, NC state or university need grants to keep
      the student within cost of attendance.
