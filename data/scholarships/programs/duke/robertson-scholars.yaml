    notes: 'Leftover passage: the Step Two text of the High School Students page says "November 15, 2025, deadline"; every other statement on the three foundation pages says November 15, 2026, and a 2025
      date cannot belong to a cycle that opens August 15, 2026, so it is treated as a typo. Selection has five steps: application, group activity (December 2026 to February 2027, rolling), semi-finalist
      interview, finalist interview, then recipient campus visits. An invitation to the group activity is not an indication of admissibility. The campus visit is for those offered the scholarship.'
