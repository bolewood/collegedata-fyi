      eligibility_notes: State waiver for non-Texas residents who hold competitive scholarships of at
        least $4,000 per academic year (no single one under $1,000). The National Scholars page says the
        President's Endowed and National Merit Recognition scholarships count toward that minimum; it
        does not say whether the Semifinalist package alone reaches it. Granted at the university's discretion
        within the state's cap. Lawfully-present documentation is required (rule effective Spring 2026);
        male students must file a Selective Service statement before the waiver posts; receipt of the
        waiver may result in adjustments to other financial aid offers; there is no minimum GPA to keep
        it while the student makes satisfactory academic progress and keeps the qualifying scholarships.
