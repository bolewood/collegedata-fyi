      November 1' while the program page banner says the SMU deadline is extended to November 4; the banner
      is read as the current value and November 1 as the pre-extension passage. The admissions-aid page
      lists November 1 as the Early Action / Early Decision I date. Finalists are notified in February
      and invited to campus for interviews, which are required; SMU pays meals and lodging.
