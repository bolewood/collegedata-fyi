    admission_plan_requirement: Admission to NCCU by the Cheatham-White application deadline, plus a nomination
      by a high school administrator or a self-nomination
    prerequisites: []
    interview_mode: unknown
    finalist_event_required: null
    notes: 'Finalist interviews cannot be rescheduled: the interview date is announced a year in advance
      and finalists are told a month before. Self-nominations go through the Eagle Promise Portal after
      an admission application and must be followed by a letter of recommendation (FAQ). The FAQ page
      still says ''for the 2026-2027 academic year'' for test-optional; the apply page says 2027-2028
      and is used here. The FAQ says recipients are notified in early March, finalists decide by mid-April
      and the class is announced in early May. The scholarship is non-binding: scholars need not attend
      NCCU.'
