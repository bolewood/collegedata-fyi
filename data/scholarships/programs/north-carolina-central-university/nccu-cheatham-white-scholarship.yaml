      eligibility_notes: 'Admitted as a first-year student in the fall to a baccalaureate program, on
        course to graduate from high school that spring. Minimum 4.0 weighted or unweighted cumulative
        GPA (the policy page says ''weighted''). Test scores are optional: the apply page says so for
        the 2027-2028 academic year; the FAQ page still says 2026-2027 (a leftover from the previous cycle).
        Selection looks at character, leadership, extracurricular involvement and service; the policy
        says financial need is not a consideration. Students are enrolled in the University Honors Program
        automatically. The policy page also lists SAT 1280 / ACT 28 as required; the apply page makes
        tests optional for 2027-2028 and is followed. Policy nominee caps by school: 2 to 5 depending
        on senior class size.'
