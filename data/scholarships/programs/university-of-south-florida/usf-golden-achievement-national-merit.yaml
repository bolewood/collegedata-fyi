    notes: The only scholarship-specific date is the May 31 first-choice deadline, with no year. The separate
      admissions dates page lists, for Fall/Summer 2027 start, an Early Action application deadline of
      November 2, 2026, Regular Decision December 16, 2026 and a Scholarship Consideration Deadline of
      January 15, 2027 for automatic merit consideration; the benefits page does not say these apply to
      the National Merit package, so they are not recorded as milestones. A downloadable National Merit
      Guide is linked from a non-USF host and was not used.
