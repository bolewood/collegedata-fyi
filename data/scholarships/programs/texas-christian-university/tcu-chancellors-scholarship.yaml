    notes: The John V. Roach Honors College application is completed in the TCU portal. November 1 and
      November 15 appear without a year; the January 15, February 14-16 and February 16 dates carry 2027
      on the page. Finalists get about one week to register. In-person participation in Interview Day
      is expected for finalists residing in the United States; finalists residing internationally may
      request a video interview. The earlier TCU lead's 'three or four years' wording did not appear on
      either page read; the first-year table says 'Full tuition for four years' and 'Up to 8 semesters',
      consistent with the eight-semester wording.
