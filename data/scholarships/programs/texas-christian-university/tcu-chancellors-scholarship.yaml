      eligibility_notes: First-year track only; the page also describes a separate transfer track (minimum
        3.85 GPA and 60 transferable hours, six semesters), which is not recorded here. Page says successful
        candidates have near-perfect grades in the most rigorous curriculum, writing samples, academic
        references and co-curricular involvement; no minimum GPA is stated for first-year applicants.
        The first-year page reports the middle 50% of 2026 scholarship recipients (all scholarship levels)
        at 3.8-3.98 GPA, which is not a minimum for this award. Students who complete the FAFSA and CSS
        Profile are notified if eligible for additional need-based aid.
