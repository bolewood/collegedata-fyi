      eligibility_notes: For entering first-year students in the College of Liberal Arts. Qualifying applicants
        typically have SATs higher than 1410 or ACTs higher than 32 and GPAs higher than 3.8 (typical
        profile, not a stated minimum). The selection paragraph says 'Both test-optional and international
        students are considered'; the Key Dates line lists SAT and/or ACT scores among the contents of
        a complete admission application, read as the generic file list rather than a scholarship rule.
        Scholars must complete the Rollins Honors Degree Program, take the Intersession Service Immersion
        course in the first year, do one off-campus experience in the first three years, and live on campus
        for four years.
