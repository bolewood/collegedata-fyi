    notes: 'CONFLICT on route: the scholarships page says the award ''requires a nomination from a recommender
      who is not related to the prospective student''; the Handler admissions page says every first-year
      applicant is reviewed ''simply by submitting an application ... no additional materials are required''
      while also inviting counselors, teachers and community officials to nominate (not students or parents).
      Nominations open September 15 and close November 30. The admissions page says the application need
      not be Early Decision. Finalists are invited to a two-part virtual interview event in mid-February;
      recipients may be invited to River Campus in late spring.'
