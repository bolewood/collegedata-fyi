      eligibility_notes: 'Need condition as the page words it: ''highly academically qualified students
        with substantial levels of financial need, as demonstrated on their CSS Profile and FAFSA, who
        have overcome significant obstacles in their lives''. The scholarships page says ''highly qualified
        students with substantial levels of financial need''. Selection is on academic excellence, potential
        to be future leaders and mastery of complex challenges. First-year, fall-term applicants only;
        transfer and spring applicants are not eligible. Recipients are described as receiving ''assured,
        complete financial support'' (tuition, fees, housing, food, books, personal expenses and transportation);
        the admissions page also calls it ''a more-than-full-tuition, four-year scholarship''.'
