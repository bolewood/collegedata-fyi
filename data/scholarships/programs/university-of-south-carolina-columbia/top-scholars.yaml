      application
    prerequisites: []
    interview_mode: mixed
    finalist_event_required: true
    notes: The Honors College application also requires two additional essays and one letter of recommendation.
      Semifinalists have a mandatory virtual interview; finalists attend an in-person Top Scholar Weekend.
      The pages name no year for Nov. 15, Dec. 1 or the interview month; only the weekend is dated.
  renewal_rules: null
  stacking_rules:
  - other_aid_type: institutional_merit
    relation: not_allowed
    note: 'Both pages footnote the top awards: they may not be combined with any other general university
      merit-based scholarship from Undergraduate Admissions, except the Provost Scholars Award (the resident
      page also excepts the Presidential Scholars Award and the USC STEM Supplement)'
  - other_aid_type: institutional_merit
    relation: allowed
    note: Provost Scholars Award (National Merit Finalists) may be combined with any other university
      merit-based scholarship
  - other_aid_type: state_merit
    relation: allowed
    note: Resident awards may be paired with a South Carolina state lottery-funded scholarship; total
      university aid cannot exceed the cost of attendance (scholarship FAQ)
